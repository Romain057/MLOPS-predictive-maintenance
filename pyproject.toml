[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"


[project]
name = "mlops-predictive-maintenance"
version = "0.1.0"
description = "MLOPS test stack technique"
requires-python = ">=3.12"
authors = [
    {name = "PaprecLab"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "mlflow>=2.11.0",
    "prometheus-fastapi-instrumentator>=7.0.0"
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0", 
    "ruff>=0.3.0",
    "dvc>=3.45.0",
]